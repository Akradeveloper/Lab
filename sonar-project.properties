# SonarQube: proyecto QA Lab
# Configuración para el scanner (CI o local). Usar SONAR_HOST_URL y SONAR_TOKEN.

sonar.projectKey=qalab
sonar.projectName=QA Lab

sonar.sources=src
sonar.exclusions=**/node_modules/**,**/.next/**,**/website/**,**/*.test.ts,**/*.spec.ts,**/*.config.*,**/coverage/**

sonar.tests=tests
sonar.test.inclusions=**/*.test.ts,**/*.spec.ts
sonar.javascript.lcov.reportPaths=coverage/lcov.info
